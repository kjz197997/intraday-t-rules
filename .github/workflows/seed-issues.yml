name: 开征询议题
# 目的：仓库一有推送，就自动把三条“请人帮我挑错/改界面”的议题开出来（已存在同名议题则跳过，不会重复）
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: 创建征询议题
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          REPO = "kjz197997/intraday-t-rules"
          API = "https://api.github.com"

          def call(method, path, payload=None):
              req = urllib.request.Request(
                  API + path,
                  method=method,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "seed-issues-bot",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          existing = [i["title"] for i in call("GET", f"/repos/{REPO}/issues?state=all&per_page=100")]

          ISSUES = [
              {
                  "title": "【规则】帮我挑错：这套分时做T的信号与拦截，会在什么地方出错",
                  "body": """## 这是什么

一个上班族自己用的 A 股 / 可转债「分时做T」提醒程序，只提醒不自动下单。规则细节见 README.md。

## 现行主逻辑（简版）

1. 用 1 分钟 K 线算偏离分（相对均价线的偏离幅度，`dev_k=0.10`，约 0.42% 起算），叠加量能、短均线、MACD/KDJ 方向，得到 0-6 的共振分；`score>=4` 才报。
2. 四层拦截：买点必须在均价线下方；单边下跌日（跌幅+长时间低于均价）只卖不买；同标的同向 6 分钟内只留第一条；同向间隔不足（股票 20 分钟 / 转债 15 分钟）视为同一组、不重复报。
3. 播报收敛：每票每方向每天最多 3 组，组内出现“买得更低/卖得更高 ≥0.5%”允许补发一次。
4. 09:35 前只入表不播报；14:45 后不再新开信号；早盘 09:45 前两次创当日新低则转观察、不报买。

## 我最想被挑的 5 个地方

- 这套“偏离+量能+均线”的打分，在什么行情结构下会系统性报错（假跌破、横盘磨、尾盘诱多）？
- “买点必须在均价线下方”这条，会不会漏掉强势股的正常回踩？有没有更稳的替代判据（如 VWAP 斜率、成交量分布）？
- 单边下跌日只卖不买——用什么指标判定更早、更准（跌幅阈值？连续新低计数？分时低点抬高/降低？）
- 6 分钟去重 + 20 分钟分组，参数是否合理？换到 5 分钟或 15 分钟周期会不会更稳？
- 有没有明显过拟合：参数是不是被某几只票的走势“喂”出来的？

## 回复格式（方便我直接抄进规则）

```
现象：哪种行情下会错
依据：你用哪只票 / 哪天的分时验证的
建议改法：具体阈值或条件
预期影响：会多报还是少报，副作用是什么
```

> 免责：纯技术讨论，不构成任何投资建议；不要贴实盘账户信息。""",
              },
              {
                  "title": "【界面】帮我设计：这 5 个页面怎么改更好看、更好用",
                  "body": """## 现在的样子（细节见 界面与功能征询.md）

1. **多股同列**：一屏 10 只小分时图，带自动分时线、买点星号 / 卖点星号、均价线。问题：小图太挤，低点看得吃力。
2. **形态图谱**：四张卡片，每张一只票的形态 + 买卖点统计（合计新口径）。问题：信息密度高，重点不突出。
3. **自动监控**：每 60 秒一轮，命中就发一句话 + 一张分时图到企业微信。问题：手机上只能看“一句话+一张图”，想快速判断还得回电脑。
4. **同屏做T格子**：按 10 分钟切格子的分时图，标当日高低点。问题：格子多、标注挤。
5. **模拟盘**：记录“如果按提示做T”的模拟结果，和实盘对照。问题：缺少一眼能看懂的胜率 / 盈亏曲线。

## 想要你给的四类建议

- **A 布局**：一屏信息优先级怎么排？三分屏（多股同列 / 形态 / 监控）该保留还是换掉？
- **B 交互**：手机上最想“两级点开就看到结论”的路径是什么？哪些必须留在电脑上？
- **C 视觉**：配色、字号、买卖点标记（现有：红色低点线、绿色高点线、星号）怎么改更醒目又不误读？
- **D 实用功能**：你觉得自己会天天用的 3 个功能是什么（例如：一键回看当天所有信号、单票信号流水、当天盈亏汇总、开盘前自动体检、语音播报带名字…）？

## 回复格式

```
页面：哪个页面
问题：哪里不好用
改法：具体怎么改（能画个草图/文字版布局最好）
```

> 说明：这是个人自用工具（Python + tkinter 桌面端 + 企业微信推送），不追求商业级 UI，只求“上班偷看一眼就懂”。""",
              },
              {
                  "title": "【回测】用你熟悉的票跑一遍，把你我结果不同的地方贴上来",
                  "body": """## 我的口径（可复现）

- 数据：新浪当日 1 分钟 K 线（238 根）+ 前一日 120 根做预热
- 判定：买点之后 30 根 1 分钟 K 线内，先涨 ≥0.3% 记为“正确”，先跌 ≤-0.5% 记为“误报”，其余记“中性”；卖点反向对称
- 样本（随机抽的 5 只，不是我自己持仓）：000063 中兴通讯、000001 平安银行、002304 洋河股份、600030 中信证券、601857 中国石油

## 我的结果（2026-11-19 当日）

| 口径 | 原始信号 | 播报 | 正确 | 误报 | 中性 |
| --- | --- | --- | --- | --- | --- |
| 收敛前 | 24 | 9 | 5 | 1 | 3 |
| 收敛后 | 24 | 5 | 3 | 0 | 2 |

## 请你做的

1. 用任意 3 只你熟的票（最好是当天振幅 >2% 的），按上面口径跑一遍；
2. 把你算出来的买点/卖点时间点贴出来（HH:MM + 价格）；
3. 指出我漏掉的、以及我多报的。

## 回复格式

```
标的：代码 名称 日期
我的买点：09:xx @price, 10:xx @price ...
我的卖点：...
和你不同的地方：...
```

> 如果你愿意，也可以直接说你的判据（比如“跌破前低 3 分钟不回头才算低点”），我按你的口径重跑对比。""",
              },
          ]

          for it in ISSUES:
              if it["title"] in existing:
                  print("skip:", it["title"])
                  continue
              r = call("POST", f"/repos/{REPO}/issues", it)
              print("created #%s %s" % (r["number"], r["title"]))
          PY
